name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare env
        run: |
          echo "DATABASE_URL=\"file:./ci.db\"" > .env
          echo "SESSION_SECRET=\"ci-session-secret-at-least-32-bytes-long-ok\"" >> .env

      - name: Prisma generate
        run: ./node_modules/.bin/prisma generate

      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        run: ./node_modules/.bin/next build

  docker-build:
    runs-on: ubuntu-latest
    needs: typecheck-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "SESSION_SECRET=ci-secret" > .env
          docker build -t ielts-app:ci .

      - name: Verify image
        run: |
          docker images ielts-app:ci
          docker inspect ielts-app:ci --format '{{.Size}}' | awk '{print "Image size:", $1/1024/1024, "MB"}'
