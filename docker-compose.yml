# 目录名为非 ASCII（雅思），compose 从目录推导的项目名会是空串并直接报错，
# 因此显式固化项目名；取值与既有容器的 com.docker.compose.project 标签一致，
# 保证接管的是同一套容器和 ielts_app-data 卷，而非新建一份。
name: ielts

services:
  app:
    build: .
    # 宿主端口刻意避开 3000：dev.sh 的 next dev 与全部 smoke 脚本都用 3000，
    # 容器若也占 3000，通配监听会兜住发往回环的连接，导致"测的是哪个实例"无法确定。
    ports:
      - "${APP_HOST_PORT:-3100}:3000"
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      SESSION_SECRET: "${SESSION_SECRET}"
      AI_TEXT_PROVIDER: "${AI_TEXT_PROVIDER:-openai}"
      AI_VOICE_PROVIDER: "${AI_VOICE_PROVIDER:-openai}"
      AI_STT_PROVIDER: "${AI_STT_PROVIDER:-openai}"
      AI_REALTIME_PROVIDER: "${AI_REALTIME_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_TEXT_MODEL: "${OPENAI_TEXT_MODEL:-gpt-4o}"
      OPENAI_TTS_MODEL: "${OPENAI_TTS_MODEL:-tts-1}"
      OPENAI_STT_MODEL: "${OPENAI_STT_MODEL:-whisper-1}"
      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-gpt-4o-realtime-preview}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_TEXT_MODEL: "${ANTHROPIC_TEXT_MODEL:-claude-sonnet-4-6}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_TEXT_MODEL: "${OLLAMA_TEXT_MODEL:-qwen2.5:7b}"
      # 不复用 NEXT_PUBLIC_APP_URL：.env 里那份是给本机 dev(3000) 用的，
      # 会盖掉这里的默认值，使容器自认在 3000 而实际映射在 APP_HOST_PORT。
      NEXT_PUBLIC_APP_URL: "${APP_PUBLIC_URL:-http://127.0.0.1:${APP_HOST_PORT:-3100}}"
    volumes:
      - ./content:/app/content
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:
