appId: app.ielts.study
productName: 雅思学习助手
directories:
  output: dist-electron
  buildResources: build
asar: true
afterPack: electron/after-pack.js
# 进 asar 的只有主进程代码。显式排除 node_modules：主进程只用 electron+node 内置模块，
# server 用的依赖已由 afterPack 单独放进 Resources/app/node_modules。
# electron-builder 默认会收集 production dependencies，故必须显式排除，否则 ~289M 冗余。
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
# 复制到 Contents/Resources/（asar 外）—— 外部 node/standalone/原生引擎无法从 asar 内执行
extraResources:
  - from: .next/standalone
    to: app
  - from: .next/static
    to: app/.next/static
  - from: public
    to: app/public
  - from: prisma/schema.prisma
    to: app/prisma/schema.prisma
  - from: content
    to: app/content
    filter:
      - "**/*"
      - "!cambridge-pdfs/**"
      - "!audio/*.mp3"
  - from: build/template.db
    to: template.db
  - from: /Users/xiyu/.local/node22/bin/node
    to: node
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.education
  icon: build/icon.icns
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: 口语练习需要访问麦克风进行录音评测
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  title: 雅思学习助手
